---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mydeployment
 
spec:
  replicas: 3
  selector:
     matchLabels:
       app: myapp
    template:
      metadata:
        lables:
          app: myapp
      spec:
        containers: 
          - name: cont1
            image: jkammila/clientapp:appimage
            ports:
              - containerPort: 80
            imagePullSecret:
              - name: dockerhub-secret 
           
