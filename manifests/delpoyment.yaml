apiVersion: apps/v1
kind: Deployment
metadata:
  name: mydeployment

spec:
  replicas: 3

  selector:
    matchLabels:
      app: myapp

  template:
    metadata:
      labels:
        app: myapp

    spec:
      imagePullSecrets:
      - name: dockerhub-secret

      containers:
      - name: cont1
        image: jagadishkammila04/clientapp:appimage

        ports:
        - containerPort: 80
