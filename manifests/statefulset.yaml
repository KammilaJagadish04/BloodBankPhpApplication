---
apiVersion: apps/v1
kind: StatefulSet
metadataL
  name: mysql
spec:
  serviceName: appservice
  replicas: 3
  selector: 
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: mycont
          images: jkammila/client:dbimage
          ports:
            - containerPort: 3306
          imagePullSecret:
            - name: mysecret
          volumeMounts:
            mountPath: /usr/share/nginx/html
          resources:
            requests:
              cpu: "100m"
              memory: "50Mi"
           limits: 
              cpu: "200m"
              memory: "10Mi"
    VolumeClaimTemplate:
    - metadata: 
        name: www
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: 
            storage: 1Gi
