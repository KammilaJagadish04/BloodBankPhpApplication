---
apiVersion: apps/v1
kind: StatefulSet
metadataL
  name: mysql
spec:
  serviceName: "mysql"
  replicas: 3
  selector: 
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: mycont
          images: jkammila/client:dbimage
          ports:
            - containerPort: 3306
          imagePullSecret:
            - name: dockerhub-secret 
          volumeMounts:
            mountPath: /usr/share/nginx/html
         
    VolumeClaimTemplate:
    - metadata: 
        name: www
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: 
            storage: 1Gi
